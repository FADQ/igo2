<mat-list-item>
  <span matListItemTitle class="fadq-client-name">
    {{client.info.numero}} - {{client.info.nom}} - {{client.tx.annee}}
  </span>

  <div matListItemMeta class="fadq-client-actions">
    <button mat-icon-button (click)="onToggleClick()">
      <mat-icon>{{ added ? 'close' : 'add' }}</mat-icon>
    </button>
    <button mat-icon-button (click)="onDeleteClick()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</mat-list-item>
